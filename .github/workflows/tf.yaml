name: 'Terraform CI/CD'

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type "yes" to confirm deployment'
        required: true
        default: 'no'

permissions:
  contents: read
  pull-requests: write

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: 'us-west-2'  

jobs:
  terraform_static_analysis:
    name: 'Terraform Static Analysis'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: tf-mods-version
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}  
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.0.1
          terraform_wrapper: false

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Validate
        working-directory: tf-mods-version  # Set the working directory to the 'terraform' folder
        run: terraform validate

      - name: Install tflint
        run: |
          curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
          tflint --version
          
      - name: Terraform Lint
        working-directory: tf-mods-version  # Set the working directory to the 'terraform' folder
        run: tflint
        
  terraform_plan_test:
    name: 'Terraform Plan for Test'
    runs-on: ubuntu-latest
    needs: terraform_static_analysis
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4  # ✅ Upgrade to v4

      - name: Setup Terraform  # ✅ Add Terraform setup
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.6.0  # Update to latest stable version

      - name: Terraform Plan for Test
        working-directory: tf-mods-version  # Ensure correct working directory
        id: plan-test
        run: |
          terraform init
          terraform plan -out=plan-test
          terraform show -no-color plan-test > plan-test.txt
      
      - name: Upload Terraform Plan Artifact for Test
        uses: actions/upload-artifact@v4  # ✅ Upgrade to v4
        with:
          name: plan-test
          path: tf-mods-version/plan-test.txt  # ✅ Ensure correct path

      
      - name: Upload Terraform Plan Artifact for Test
        uses: actions/upload-artifact@v4  
        with:
          name: plan-test
          path: tf-mods-version/plan-test.txt  #Ensure correct path


  terraform_apply:
    name: 'Terraform Apply'
    runs-on: ubuntu-latest
    needs: [terraform_plan_test]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirmation == 'yes'
    steps:
      - uses: actions/checkout@v2

      - name: Terraform Apply
        working-directory: tf-mods-version  # Set the working directory to the 'terraform' folder
        run: |
          terraform init
          terraform apply -auto-approve
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: 'us-west-2'
          
